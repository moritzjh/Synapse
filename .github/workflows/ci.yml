name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libsqlite3-dev
      - name: ONNX Runtime
        run: ./scripts/setup_onnxruntime.sh
      - name: Build
        run: cmake -S backend -B backend/build -G Ninja -DSYNAPSE_ARCH_FLAGS= && cmake --build backend/build
      - name: Test
        run: ./backend/build/synapse_tests

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx eslint src
      - run: npm run build
