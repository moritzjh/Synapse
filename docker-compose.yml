# Synapse – start with:  docker compose up -d   → http://localhost:8080
services:
  synapse:
    image: ghcr.io/moritzjh/synapse:latest   # prebuilt for x86-64 and ARM (Apple Silicon, Raspberry Pi)
    build:                                   # or build it yourself: docker compose up -d --build
      context: .
      args:
        MODEL: e5                            # "minilm" = smaller, English only
    container_name: synapse
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"                # only reachable from this computer (there is no login yet)
    volumes:
      - ./data:/data                         # synapse.db + vault/ with all notes as .md (open it in Obsidian)
    environment:
      PUID: "1000"                           # Linux: output of `id -u` / `id -g`, so the files belong to you
      PGID: "1000"
      SYNAPSE_DEMO: "1"                      # 0 = start empty instead of with the demo notes
